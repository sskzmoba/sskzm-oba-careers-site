<main class="wrap" id="main">

    <h1>Past posts</h1>
    <p>Closed posts, kept for reference and grouped by the month they closed. Useful for knowing when a recruitment or scholarship usually comes up each year.</p>

<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var O = window.OBA, el = O.el, $ = O.$, entries = [];
  function draw() {
    var box = O.clear($('#alist')), q = $('#aq').value.trim().toLowerCase();
    var list = entries.filter(function (e) { return !q || [e.title, e.org, e.description].join(' ').toLowerCase().indexOf(q) !== -1; });
    if (!list.length) { box.appendChild(el('div', { class: 'empty' }, el('p', { text: 'Nothing here.' }))); return; }
    list.sort(function (a, b) { return (b.expiry_date || '').localeCompare(a.expiry_date || ''); });
    list.forEach(function (e) {
      var sec = O.SECTIONS[e.section] || { long: '' };
      box.appendChild(el('article', { class: 'post', 'data-section': e.section, style: 'grid-template-columns:1fr' },
        el('div', { class: 'post-body' },
          el('div', { class: 'kind' }, el('span', { text: sec.long }), el('span', { class: 'exp', text: 'Closed ' + O.niceDate(e.expiry_date) })),
          el('h3', { text: e.title }), e.org ? el('div', { class: 'org', text: e.org }) : null,
          el('p', { class: 'desc', text: e.description || '' }))));
    });
  }
  function loadMonth(m) {
    O.clear($('#alist')).appendChild(el('div', { class: 'skeleton' }));
    O.apiGet({ action: 'archive', month: m }).then(function (r) { entries = (r && r.entries) || []; draw(); });
  }
  document.addEventListener('DOMContentLoaded', function () {
    O.apiGet({ action: 'archive' }).then(function (r) {
      var sel = O.clear($('#month')), months = (r && r.months) || [];
      if (!months.length) { sel.appendChild(el('option', { value: '', text: 'No past posts yet' })); return; }
      months.forEach(function (m) { var p = m.split('-'); sel.appendChild(el('option', { value: m, text: O.MONTHS[+p[1] - 1].charAt(0) + O.MONTHS[+p[1] - 1].slice(1).toLowerCase() + ' ' + p[0] })); });
      loadMonth(months[0]);
    }).catch(function () { O.clear($('#month')).appendChild(el('option', { text: 'Could not load' })); });
    $('#month').addEventListener('change', function () { loadMonth(this.value); });
    $('#aq').addEventListener('input', draw);
  });
})();
</script>
</body>
</html>
